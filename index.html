<!DOCTYPE html>
<html>


<head>
    <title>😚Click the ikon😚</title>


    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #1B1035;
            color: white;
            padding-top: 50px;
        }


        #duck {
            font-size: 80px;
            background: #FFD23F;
            border: none;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            cursor: pointer;
            position:absolute;
        }


        #kiss {
            font-size: 80px;
            background: #b43e3e;
            border: none;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            cursor: pointer;
            position:absolute;
        }


        #reset {
            display: block;
            margin: 300px auto;
            padding: 10px 25px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>


<body>


    <h1>😚Click the ikon😚</h1>


    <h2>
        Score: <span id="score">0</span>
    </h2>
     <h2>
        Time: <span id="time">30</span>
    </h2>


    <button id="duck">
        🐥
    </button>


    <button id="kiss">
        😘
    </button>


    <button id="reset">
        🔄 Reset
    </button>




    <script>


        // =========================
        // 1. VARIABLE
        // =========================


        let score = 0;
        let time = 30;


        // =========================
        // 2. DOM
        // =========================


        const duck =
            document.getElementById("duck");


        const kiss =
            document.getElementById("kiss");


        const reset =
            document.getElementById("reset");


        const scoreText =
            document.getElementById("score");


        const timeText =
            document.getElementById("time");


        // =========================
        // 3. FUNCTION
        // =========================


        function tambahScore() {


            //score++;
            score += 5;


            scoreText.textContent = score;


        }




        function resetGame() {


            score = 0;


            scoreText.textContent = score;


        }


        function moveduck() {


            const x = Math.random() * 500;
            const y = Math.random() * 300;


            duck.style.left = x + "px";
            duck.style.top = y + "px";


}


        function movekiss() {


            const x = Math.random() * 500;
            const y = Math.random() * 300;


            kiss.style.left = x + "px";
            kiss.style.top = y + "px";


}


        // =========================
        // 4. EVENT
        // =========================


        duck.addEventListener(
            "click",
            function () {
                tambahScore();
                moveduck();
        }
        );


        kiss.addEventListener(
            "click",
            function () {
                tambahScore();
                movekiss();
            }
        );


        reset.addEventListener(
            "click",
            resetGame
        );


        // =========================
        // 5. TIMER
        // =========================


        const timer = setInterval(
             function() {


                 time -= 1;


                timeText.textContent = time;


                if (time === 0) {


                    clearInterval(timer);


                    duck.disabled = true;
                    duck.style.display = "none";


                    alert ("uwaww! tapi Time Over😫!");
                }
           


            },
            1000
    );


    </script>


</body>


</html>
